<!DOCTYPE html>
<html>
 <head>
    <title> Acesso ao uso </title>
 </head>
 <body>
  <header>
    <h1> cadastro</h1>
  </header>
  <main>
    <section>
      <form action="inscricao.html" method="post">

        <label for="name">Nome: </label>
        <input type="text" id="name" name="nome" required>

        <label for="email"> Email: </label>
        <input type="email" id="email" name="email" required>

        <label for="senha"> Senha: </label>
        <input type="password" id="senha" name="senha" required>

        <label for="idade"> Idade: </label>
        <input type="number" id="idade" name="idade">

        <label for="data"> Data: </label>
        <input type="date" id="data" name="data" required>

        <label for="quantidade"> Quantidade de participantes: </label>
        <input type="number" id="quantidade" name="quantidade" required>

        <button type="submit">Enviar</button>
      </form>
      <a href="cadastro.html"> Fazer outro cadastro</a>
    </section>
    <section>
        <h2> Regras do evento </h2>
          <ul>
            <li>Não levar coisas ilegais</li>
            <li>Não alcohol</li>
            <li>Não megafonos</li>
          </ul> 
    </section>
    <img src="evento.jpg" alt="Evento pop 2026">
  </main>
  <aside>
    <nav>
       <a href="contato.html"> Para mais informações <br></a>
       <a href="https://pagoseventos.com" target="_blank">Site para pagos</a>
    </nav>
  </aside>
  <footer>
       <p> Evento 2026<br> Organizado por Jóse José</p> 
    </footer>
 </body>
</html>
